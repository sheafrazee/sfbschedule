<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SFB Training Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<style>
:root {
  --ink: #111111;
  --warm-white: #F4F1EC;
  --stone: #9B9590;
  --dark-stone: #5C5652;
  --light-stone: #D6D1CC;
  --clay: #B8694A;
  --green: #2e7d32;
  --amber: #c87a00;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Source Sans 3', sans-serif; background: var(--warm-white); color: var(--ink); }
.wrap { max-width: 1200px; margin: 0 auto; padding: 20px 16px; }

.sfb-header { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 2px solid var(--ink); }
.sfb-badge { width: 56px; height: 56px; border-radius: 50%; background: var(--ink); display: flex; align-items: center; justify-content: center; flex-shrink: 0; padding: 10px; }
.sfb-badge svg { width: 100%; height: 100%; }
.sfb-header h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 22px; font-weight: 800; color: var(--ink); margin-bottom: 2px; letter-spacing: -.02em; }
.sfb-header p { font-family: 'Source Sans 3', sans-serif; font-size: 14px; color: var(--stone); }
.header-meta { flex: 1; }
.mode-toggle { display: flex; gap: 6px; }
.mode-btn { padding: 8px 16px; border: 1.5px solid var(--ink); border-radius: 8px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 13px; cursor: pointer; background: #fff; color: var(--ink); transition: all .15s; }
.mode-btn.active { background: var(--ink); color: var(--warm-white); }

.action-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; padding: 12px; background: #fff; border: 1px solid var(--light-stone); border-radius: 10px; align-items: center; }
.action-bar .group { display: flex; gap: 6px; align-items: center; }
.action-bar .sep { width: 1px; height: 24px; background: var(--light-stone); margin: 0 4px; }
.action-bar label { font-size: 12px; font-weight: 600; color: var(--dark-stone); font-family: 'Plus Jakarta Sans', sans-serif; }
.action-bar input.week-title { padding: 6px 10px; border: 1.5px solid var(--light-stone); border-radius: 6px; font-family: 'Source Sans 3', sans-serif; font-size: 14px; min-width: 200px; }
.btn { padding: 7px 14px; border: 1.5px solid var(--light-stone); border-radius: 6px; background: #fff; cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12px; font-weight: 600; transition: all .15s; color: var(--ink); }
.btn:hover { background: var(--warm-white); }
.btn.primary { background: var(--ink); color: var(--warm-white); border-color: var(--ink); }
.btn.primary:hover { background: var(--dark-stone); }
.btn.publish { background: var(--clay); color: #fff; border-color: var(--clay); }
.btn.publish:hover { filter: brightness(.92); }
.btn.publish:disabled { opacity: .5; cursor: not-allowed; }
.btn.danger { color: var(--clay); border-color: #B8694A55; }
.btn.danger:hover { background: #B8694A11; }

.status-pill { font-size: 11px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; padding: 4px 10px; border-radius: 12px; }
.status-pill.clean { background: #2e7d3222; color: var(--green); }
.status-pill.dirty { background: #c87a0022; color: var(--amber); }
.status-pill.error { background: #B8694A22; color: var(--clay); }

.filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
.filter-bar input { padding: 8px 12px; border: 1.5px solid var(--light-stone); border-radius: 8px; font-size: 14px; font-family: 'Source Sans 3', sans-serif; width: 200px; background: #fff; outline: none; transition: border-color .2s; }
.filter-bar input:focus { border-color: var(--stone); }
.type-btn { padding: 6px 14px; border: 1.5px solid var(--light-stone); border-radius: 20px; font-size: 13px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; cursor: pointer; background: #fff; transition: all .15s; }
.type-btn:hover { background: #f0ede8; }
.type-btn.active { background: var(--ink); color: var(--warm-white); border-color: var(--ink); }
.day-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.day-col { background: #fff; border-radius: 12px; border: 1px solid var(--light-stone); overflow: hidden; }
.day-header { padding: 12px 16px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: .3px; border-bottom: 1px solid var(--light-stone); display: flex; justify-content: space-between; align-items: center; color: var(--ink); }
.day-header .count { font-weight: 400; font-size: 12px; color: var(--stone); }
.event-card { padding: 10px 14px; border-left: 3px solid transparent; margin: 6px 8px; border-radius: 6px; transition: background .15s; }
.event-card:hover { filter: brightness(.97); }
.event-time { font-family: 'Source Sans 3', sans-serif; font-size: 11px; font-weight: 500; color: var(--stone); margin-bottom: 2px; letter-spacing: .02em; }
.event-title { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 13.5px; color: var(--ink); margin-bottom: 4px; line-height: 1.3; }
.event-people { font-family: 'Source Sans 3', sans-serif; font-size: 12px; color: var(--dark-stone); line-height: 1.5; }
.event-people .hl { background: #B8694A33; border-radius: 2px; padding: 0 2px; font-weight: 600; color: var(--clay); }
.event-note { font-family: 'Source Sans 3', sans-serif; font-size: 11px; color: var(--stone); font-style: italic; margin-top: 3px; }
.empty-msg { padding: 20px 16px; color: var(--light-stone); font-size: 13px; text-align: center; }

.edit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; }
.edit-day { background: #fff; border-radius: 12px; border: 1px solid var(--light-stone); overflow: hidden; }
.edit-day-header { padding: 10px 14px; background: var(--ink); color: var(--warm-white); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.edit-day-header input { background: transparent; color: var(--warm-white); border: 1px dashed #ffffff44; border-radius: 4px; padding: 4px 8px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 14px; flex: 1; outline: none; }
.edit-day-header input:focus { border-color: var(--warm-white); }
.edit-day-body { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.edit-event { background: var(--warm-white); border: 1px solid var(--light-stone); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px; cursor: grab; }
.edit-event:active { cursor: grabbing; }
.sortable-ghost { opacity: 0.3; }
.sortable-drag { box-shadow: 0 12px 32px rgba(0,0,0,.18); transform: rotate(1deg); cursor: grabbing; }
.edit-event-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.edit-event input, .edit-event select, .edit-event textarea { padding: 5px 8px; border: 1px solid var(--light-stone); border-radius: 5px; font-family: 'Source Sans 3', sans-serif; font-size: 12.5px; background: #fff; outline: none; }
.edit-event input:focus, .edit-event select:focus, .edit-event textarea:focus { border-color: var(--stone); }
.edit-event .ev-time { width: 80px; }
.edit-event .ev-title { flex: 1; min-width: 140px; }
.edit-event .ev-type { width: 90px; }
.edit-event textarea { width: 100%; resize: vertical; min-height: 36px; }
.edit-event-label { font-size: 10.5px; font-weight: 600; color: var(--stone); text-transform: uppercase; letter-spacing: .04em; font-family: 'Plus Jakarta Sans', sans-serif; }
.edit-event-actions { display: flex; justify-content: flex-end; gap: 4px; }
.icon-btn { width: 26px; height: 26px; border-radius: 5px; border: 1px solid var(--light-stone); background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; line-height: 1; padding: 0; }
.icon-btn:hover { background: var(--warm-white); }
.icon-btn.danger { color: var(--clay); border-color: #B8694A55; }
.add-event-btn { padding: 8px; border: 1.5px dashed var(--light-stone); border-radius: 6px; background: transparent; cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 12px; color: var(--dark-stone); }
.add-event-btn:hover { border-color: var(--ink); color: var(--ink); }
.add-day-btn { grid-column: 1 / -1; padding: 20px; border: 2px dashed var(--light-stone); border-radius: 12px; background: transparent; cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 14px; color: var(--dark-stone); }
.add-day-btn:hover { border-color: var(--ink); color: var(--ink); }

/* Modal */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
.modal { background: #fff; border-radius: 14px; max-width: 520px; width: 100%; padding: 24px; max-height: 90vh; overflow-y: auto; }
.modal h2 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 800; margin-bottom: 6px; }
.modal p { font-size: 13px; color: var(--dark-stone); margin-bottom: 16px; line-height: 1.5; }
.modal p a { color: var(--clay); }
.modal-field { margin-bottom: 12px; }
.modal-field label { display: block; font-size: 11.5px; font-weight: 700; color: var(--dark-stone); text-transform: uppercase; letter-spacing: .04em; font-family: 'Plus Jakarta Sans', sans-serif; margin-bottom: 4px; }
.modal-field input { width: 100%; padding: 8px 10px; border: 1.5px solid var(--light-stone); border-radius: 6px; font-family: 'Source Sans 3', sans-serif; font-size: 13px; outline: none; }
.modal-field input:focus { border-color: var(--stone); }
.modal-field .hint { font-size: 11px; color: var(--stone); margin-top: 3px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

.hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="sfb-header">
    <div class="sfb-badge">
      <svg viewBox="50 10 275 275" xmlns="http://www.w3.org/2000/svg">
        <path fill="#F4F1EC" d="M 317.734375 145.902344 C 317.734375 143.558594 317.734375 138.863281 317.734375 136.519531 L 127.660156 136.519531 C 132.355469 108.359375 155.820312 87.238281 183.980469 84.894531 C 186.328125 84.894531 188.671875 82.546875 188.671875 80.199219 L 188.671875 68.464844 C 188.671875 66.121094 186.328125 66.121094 186.328125 63.773438 C 183.980469 63.773438 183.980469 63.773438 181.632812 63.773438 C 141.742188 66.121094 108.886719 96.625 104.195312 136.519531 L 80.730469 136.519531 C 85.421875 82.546875 130.007812 42.652344 181.632812 40.308594 C 186.328125 40.308594 188.671875 37.960938 188.671875 35.613281 L 188.671875 21.535156 C 188.671875 21.535156 186.328125 19.1875 186.328125 19.1875 C 183.980469 16.839844 183.980469 16.839844 181.632812 16.839844 C 113.582031 19.1875 57.261719 77.851562 57.261719 145.902344 C 57.261719 150.597656 57.261719 155.289062 57.261719 157.636719 L 249.683594 157.636719 C 242.644531 185.796875 221.523438 206.914062 191.019531 209.261719 C 188.671875 209.261719 188.671875 211.609375 188.671875 213.957031 L 188.671875 225.6875 C 188.671875 228.035156 188.671875 228.035156 188.671875 230.382812 C 191.019531 230.382812 191.019531 230.382812 193.367188 230.382812 C 233.257812 228.035156 266.109375 197.53125 270.804688 157.636719 L 294.269531 157.636719 C 289.578125 211.609375 244.992188 251.5 193.367188 253.847656 C 188.671875 253.847656 188.671875 256.195312 188.671875 258.542969 L 188.671875 272.621094 C 188.671875 274.96875 188.671875 274.96875 188.671875 274.96875 C 191.019531 277.3125 191.019531 277.3125 193.367188 277.3125 C 261.417969 274.96875 317.734375 216.300781 317.734375 145.902344 Z" fill-rule="evenodd"/>

    </div>
    <div class="header-meta">
      <h1 id="weekTitleDisplay">Loading…</h1>

    <div class="mode-toggle hidden" id="modeToggle">
      <button class="mode-btn active" data-mode="display">View</button>

  <div id="displayView">

<!-- Settings Modal -->
<div class="modal-bg hidden" id="settingsModal">
  <div class="modal">
    <h2>GitHub Settings</h2>
    <p>Connect this app to your GitHub repo. Get a fine-grained PAT at <a href="https://github.com/settings/personal-access-tokens/new" target="_blank">github.com/settings/personal-access-tokens</a> with <b>Contents: Read &amp; Write</b> on this one repo. Stored only in this browser.</p>
    <div class="modal-field">
      <label>GitHub Owner (username/org)</label>
      <input id="cfgOwner" placeholder="e.g. yourname">
    </div>
    <div class="modal-field">
      <label>Repo Name</label>
      <input id="cfgRepo" placeholder="e.g. sfb-schedule">
    </div>
    <div class="modal-field">
      <label>Branch</label>
      <input id="cfgBranch" placeholder="main" value="main">
    </div>
    <div class="modal-field">
      <label>Path to JSON file</label>
      <input id="cfgPath" placeholder="schedule.json" value="schedule.json">
      <div class="hint">Relative to repo root</div>
    </div>
    <div class="modal-field">
      <label>Personal Access Token</label>
      <input id="cfgToken" type="password" placeholder="github_pat_...">
      <div class="hint">Stored only in your browser's localStorage</div>
    </div>
    <div class="modal-actions">
      <button class="btn" id="cfgCancel">Cancel</button>
      <button class="btn" id="cfgClear">Clear Token</button>
      <button class="btn primary" id="cfgSave">Save</button>
    </div>
  </div>
</div>

<script>
// ============ CONFIG ============
const LS_DRAFT = "sfb_schedule_draft_v2";
const LS_CFG = "sfb_schedule_cfg_v2";
const LS_PUBLISHED = "sfb_schedule_published_v2";

const STYLES = {
  excel:  { bg: "#F4F1EC", border: "#B8694A" },
  map:    { bg: "#f0ede8", border: "#9B9590" },
  group:  { bg: "#FFFBEA", border: "#D4A843" },
  other:  { bg: "#f7f5f2", border: "#D6D1CC" },
  allday: { bg: "#1a1a1a", border: "#111" },
};

const DEFAULT_DATA = { weekTitle: "Week of —", days: [] };

// ============ STATE ============
let publishedData = null;  // last-known state on GitHub (also from initial fetch)
let publishedSha = null;   // GitHub file sha for safe updates
let data = null;           // current working copy (may have unpublished drafts)
let personFilter = "";
let typeFilter = "all";
let currentMode = "display";

function loadCfg() {
  try { return JSON.parse(localStorage.getItem(LS_CFG)) || {}; } catch { return {}; }
}
function saveCfg(c) { localStorage.setItem(LS_CFG, JSON.stringify(c)); }
function loadDraft() {
  try { return JSON.parse(localStorage.getItem(LS_DRAFT)); } catch { return null; }
}
function saveDraft() { localStorage.setItem(LS_DRAFT, JSON.stringify(data)); updateStatus(); }
function clearDraft() { localStorage.removeItem(LS_DRAFT); }

function isDirty() {
  if (!publishedData) return true;
  return JSON.stringify(data) !== JSON.stringify(publishedData);
}

function updateStatus() {
  const pill = document.getElementById("statusPill");
  const btn = document.getElementById("publishBtn");
  if (!loadCfg().token) {
    pill.textContent = "Not connected";
    pill.className = "status-pill error";
    btn.disabled = true;
    return;
  }
  if (isDirty()) {
    pill.textContent = "● Unpublished changes";
    pill.className = "status-pill dirty";
    btn.disabled = false;
  } else {
    pill.textContent = "✓ Published";
    pill.className = "status-pill clean";
    btn.disabled = true;
  }
}

// ============ INITIAL LOAD ============
async function init() {
  // 1. Try to fetch published schedule.json from the live site
  try {
    const cfg = loadCfg();
    const path = cfg.path || "schedule.json";
    const res = await fetch(`./${path}?t=${Date.now()}`, { cache: "no-store" });
    if (res.ok) {
      publishedData = await res.json();
      localStorage.setItem(LS_PUBLISHED, JSON.stringify(publishedData));
    }
  } catch (e) { console.warn("Couldn't fetch schedule.json from site:", e); }

  // 2. Fallback to last known published from localStorage
  if (!publishedData) {
    try { publishedData = JSON.parse(localStorage.getItem(LS_PUBLISHED)); } catch {}
  }

  // 3. Use a draft if one exists, otherwise the published, otherwise empty
  const draft = loadDraft();
  if (draft) {
    data = draft;
  } else if (publishedData) {
    data = JSON.parse(JSON.stringify(publishedData));
  } else {
    data = JSON.parse(JSON.stringify(DEFAULT_DATA));
  }

  // 4. Get current sha from GitHub if we have credentials
  await refreshSha();

  setMode("display");
  updateStatus();
}

async function refreshSha() {
  const cfg = loadCfg();
  if (!cfg.token || !cfg.owner || !cfg.repo) return;
  try {
    const path = cfg.path || "schedule.json";
    const branch = cfg.branch || "main";
    const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}?ref=${branch}`;
    const res = await fetch(url, { headers: { "Authorization": `Bearer ${cfg.token}`, "Accept": "application/vnd.github+json" } });
    if (res.ok) {
      const j = await res.json();
      publishedSha = j.sha;
      // Also refresh publishedData from authoritative source
      try {
        const decoded = atob(j.content.replace(/\s/g, ""));
        publishedData = JSON.parse(new TextDecoder().decode(Uint8Array.from(decoded, c => c.charCodeAt(0))));
        localStorage.setItem(LS_PUBLISHED, JSON.stringify(publishedData));
      } catch (e) { /* ignore */ }
    } else if (res.status === 404) {
      publishedSha = null; // file doesn't exist yet, will create
    } else {
      console.warn("GitHub fetch failed:", res.status);
    }
  } catch (e) { console.warn("refreshSha error:", e); }
}

// ============ PUBLISH ============
async function publish() {
  const cfg = loadCfg();
  if (!cfg.token || !cfg.owner || !cfg.repo) {
    alert("Set up GitHub Settings first.");
    openSettings(); return;
  }
  const path = cfg.path || "schedule.json";
  const branch = cfg.branch || "main";
  const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`;
  const contentB64 = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
  const body = {
    message: `Update schedule: ${data.weekTitle || "(no title)"}`,
    content: contentB64,
    branch: branch,
  };
  if (publishedSha) body.sha = publishedSha;

  const pill = document.getElementById("statusPill");
  pill.textContent = "Publishing…";
  pill.className = "status-pill dirty";

  try {
    const res = await fetch(url, {
      method: "PUT",
      headers: { "Authorization": `Bearer ${cfg.token}`, "Accept": "application/vnd.github+json", "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      const err = await res.text();
      throw new Error(`${res.status}: ${err}`);
    }
    const j = await res.json();
    publishedSha = j.content.sha;
    publishedData = JSON.parse(JSON.stringify(data));
    localStorage.setItem(LS_PUBLISHED, JSON.stringify(publishedData));
    clearDraft();
    updateStatus();
    pill.textContent = "✓ Published — Netlify rebuilding";
    pill.className = "status-pill clean";
    setTimeout(updateStatus, 3000);
  } catch (e) {
    console.error(e);
    pill.textContent = "✗ Publish failed";
    pill.className = "status-pill error";
    alert("Publish failed: " + e.message);
  }
}

// ============ DISPLAY MODE ============
function renderDisplay() {
  document.getElementById("weekTitleDisplay").textContent = data.weekTitle || "";
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  (data.days || []).forEach(day => {
    const events = (day.events || []).filter(e => {
      const pm = !personFilter || (e.people || []).some(p => p.toLowerCase().includes(personFilter.toLowerCase()));
      const tm = typeFilter === "all" || e.type === typeFilter;
      return pm && tm;
    });
    const col = document.createElement("div");
    col.className = "day-col";
    col.innerHTML = `<div class="day-header">${escapeHtml(day.day)}<span class="count">${events.length} event${events.length !== 1 ? "s" : ""}</span></div>`;
    if (events.length === 0) {
      col.innerHTML += `<div class="empty-msg">No matching events</div>`;
    } else {
      events.forEach(e => {
        const s = STYLES[e.type] || STYLES.other;
        const isAllDay = e.type === "allday";
        const people = e.people || [];
        const peopleHtml = people.length ? `<div class="event-people">${people.map(p => {
          if (personFilter && p.toLowerCase().includes(personFilter.toLowerCase())) return `<span class="hl">${escapeHtml(p)}</span>`;
          return escapeHtml(p);
        }).join(", ")}</div>` : "";
        const noteHtml = e.note ? `<div class="event-note">${escapeHtml(e.note)}</div>` : "";
        col.innerHTML += `<div class="event-card" style="background:${s.bg};border-left-color:${s.border};${isAllDay ? "color:#F4F1EC;" : ""}">
          <div class="event-time" ${isAllDay ? 'style="color:#9B9590"' : ""}>${escapeHtml(e.time)}</div>
          <div class="event-title" ${isAllDay ? 'style="color:#F4F1EC"' : ""}>${escapeHtml(e.title)}</div>
          ${peopleHtml}${noteHtml}
        </div>`;
      });
    }
    grid.appendChild(col);
  });
}

// ============ EDIT MODE ============
function renderEdit() {
  document.getElementById("weekTitleInput").value = data.weekTitle || "";
  const grid = document.getElementById("editGrid");
  grid.innerHTML = "";
  (data.days || []).forEach((day, di) => {
    const dEl = document.createElement("div");
    dEl.className = "edit-day";
    dEl.innerHTML = `
      <div class="edit-day-header">
        <input type="text" value="${escapeAttr(day.day)}" data-day="${di}" data-field="day">
        <button class="icon-btn danger" data-remove-day="${di}" title="Remove day">✕</button>
      </div>
      <div class="edit-day-body" id="dayBody${di}"></div>
    `;
    grid.appendChild(dEl);
    const body = dEl.querySelector(`#dayBody${di}`);
    (day.events || []).forEach((ev, ei) => body.appendChild(buildEventEditor(di, ei, ev)));
    const addBtn = document.createElement("button");
    addBtn.className = "add-event-btn";
    addBtn.textContent = "+ Add Event";
    addBtn.onclick = () => {
      data.days[di].events.push({ time: "8:00 AM", title: "New Event", type: "group", people: [], note: "" });
      saveDraft(); renderEdit();
    };
    body.appendChild(addBtn);
  });
  const addDay = document.createElement("button");
  addDay.className = "add-day-btn";
  addDay.textContent = "+ Add Day";
  addDay.onclick = () => {
    data.days.push({ day: "New Day", events: [] });
    saveDraft(); renderEdit();
  };
  grid.appendChild(addDay);
  attachEditListeners();
  updateStatus();
}

function buildEventEditor(di, ei, ev) {
  const el = document.createElement("div");
  el.className = "edit-event";
  el.innerHTML = `
    <div class="edit-event-row">
      <input class="ev-time" type="text" value="${escapeAttr(ev.time)}" data-d="${di}" data-e="${ei}" data-field="time" placeholder="Time">
      <input class="ev-title" type="text" value="${escapeAttr(ev.title)}" data-d="${di}" data-e="${ei}" data-field="title" placeholder="Title">
      <select class="ev-type" data-d="${di}" data-e="${ei}" data-field="type">
        ${["excel","map","group","other","allday"].map(t => `<option value="${t}" ${ev.type===t?"selected":""}>${t}</option>`).join("")}
      </select>
    </div>
    <div>
      <div class="edit-event-label">People (comma-separated)</div>
      <textarea data-d="${di}" data-e="${ei}" data-field="people" rows="2">${escapeHtml((ev.people||[]).join(", "))}</textarea>
    </div>
    <div>
      <div class="edit-event-label">Note (optional)</div>
      <input type="text" style="width:100%" value="${escapeAttr(ev.note||"")}" data-d="${di}" data-e="${ei}" data-field="note" placeholder="Optional note">
    </div>
    <div class="edit-event-actions">
      <button class="icon-btn danger" data-remove-event data-d="${di}" data-e="${ei}" title="Remove event">✕</button>
    </div>
  `;
  return el;
}

function attachEditListeners() {
  document.querySelectorAll("[data-d][data-e][data-field]").forEach(input => {
    input.addEventListener("change", () => {
      const di = +input.dataset.d, ei = +input.dataset.e, field = input.dataset.field;
      let v = input.value;
      if (field === "people") v = v.split(",").map(s => s.trim()).filter(Boolean);
      data.days[di].events[ei][field] = v;
      saveDraft();
    });
  });
  document.querySelectorAll("[data-day][data-field='day']").forEach(input => {
    input.addEventListener("change", () => { data.days[+input.dataset.day].day = input.value; saveDraft(); });
  });
  document.querySelectorAll("[data-remove-event]").forEach(btn => {
    btn.addEventListener("click", () => {
      const di = +btn.dataset.d, ei = +btn.dataset.e;
      if (confirm("Remove this event?")) { data.days[di].events.splice(ei, 1); saveDraft(); renderEdit(); }
    });
  });
  document.querySelectorAll("[data-remove-day]").forEach(btn => {
    btn.addEventListener("click", () => {
      const di = +btn.dataset.removeDay;
      if (confirm(`Remove "${data.days[di].day}" and all its events?`)) { data.days.splice(di, 1); saveDraft(); renderEdit(); }
    });
  });

  // Initialize Sortable on each day body — drag events within a day or between days
  document.querySelectorAll(".edit-day-body").forEach(body => {
    const di = +body.id.replace("dayBody", "");
    new Sortable(body, {
      group: "events",
      animation: 150,
      draggable: ".edit-event",
      filter: "input, textarea, select, button",
      preventOnFilter: false,
      delay: 150,
      delayOnTouchOnly: true,
      onEnd: function(evt) {
        const fromDi = +evt.from.id.replace("dayBody", "");
        const toDi = +evt.to.id.replace("dayBody", "");
        const fromIdx = evt.oldIndex;
        const toIdx = evt.newIndex;
        if (fromDi === toDi && fromIdx === toIdx) return;
        const [moved] = data.days[fromDi].events.splice(fromIdx, 1);
        data.days[toDi].events.splice(toIdx, 0, moved);
        saveDraft();
        renderEdit();
      }
    });
  });
}

// ============ SETTINGS ============
function openSettings() {
  const cfg = loadCfg();
  document.getElementById("cfgOwner").value = cfg.owner || "";
  document.getElementById("cfgRepo").value = cfg.repo || "";
  document.getElementById("cfgBranch").value = cfg.branch || "main";
  document.getElementById("cfgPath").value = cfg.path || "schedule.json";
  document.getElementById("cfgToken").value = cfg.token || "";
  document.getElementById("settingsModal").classList.remove("hidden");
}
function closeSettings() { document.getElementById("settingsModal").classList.add("hidden"); }

// ============ MODE TOGGLE ============
function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll(".mode-btn").forEach(b => b.classList.toggle("active", b.dataset.mode === mode));
  document.getElementById("displayView").classList.toggle("hidden", mode !== "display");
  document.getElementById("editView").classList.toggle("hidden", mode !== "edit");
  if (mode === "display") renderDisplay();
  else renderEdit();
}

// ============ JSON IO ============
function exportJson() {
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `schedule_${(data.weekTitle||"week").replace(/\s+/g,"_").replace(/[^\w\-]/g,"")}.json`;
  a.click();
  URL.revokeObjectURL(url);
}
function importJson(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const obj = JSON.parse(e.target.result);
      if (!obj.days || !Array.isArray(obj.days)) throw new Error("Invalid format — needs { weekTitle, days: [...] }");
      data = obj; saveDraft(); setMode(currentMode);
    } catch (err) { alert("Import failed: " + err.message); }
  };
  reader.readAsText(file);
}

// ============ UTILS ============
function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

// ============ WIRE UP ============
// Reveal mode toggle only if URL has ?edit=1
const urlParams = new URLSearchParams(window.location.search);
const editUnlocked = urlParams.get("edit") === "1";
if (editUnlocked) document.getElementById("modeToggle").classList.remove("hidden");

document.querySelectorAll(".mode-btn").forEach(b => b.addEventListener("click", () => {
  // Block edit mode unless unlocked
  if (b.dataset.mode === "edit" && !editUnlocked) return;
  setMode(b.dataset.mode);
}));
document.getElementById("personFilter").addEventListener("input", function(){ personFilter = this.value; renderDisplay(); });
document.querySelectorAll(".type-btn").forEach(btn => btn.addEventListener("click", function(){
  document.querySelectorAll(".type-btn").forEach(b => b.classList.remove("active"));
  this.classList.add("active"); typeFilter = this.dataset.type; renderDisplay();
}));
document.getElementById("weekTitleInput").addEventListener("change", function(){ data.weekTitle = this.value; saveDraft(); document.getElementById("weekTitleDisplay").textContent = this.value; });
document.getElementById("publishBtn").addEventListener("click", publish);
document.getElementById("settingsBtn").addEventListener("click", openSettings);
document.getElementById("exportJsonBtn").addEventListener("click", exportJson);
document.getElementById("importJsonBtn").addEventListener("click", () => document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change", e => { if (e.target.files[0]) importJson(e.target.files[0]); });
document.getElementById("discardBtn").addEventListener("click", () => {
  if (!isDirty()) { alert("No drafts to discard."); return; }
  if (confirm("Discard unpublished changes and revert to published version?")) {
    data = publishedData ? JSON.parse(JSON.stringify(publishedData)) : JSON.parse(JSON.stringify(DEFAULT_DATA));
    clearDraft(); setMode(currentMode);
  }
});
document.getElementById("cfgCancel").addEventListener("click", closeSettings);
document.getElementById("cfgClear").addEventListener("click", () => {
  if (confirm("Remove GitHub token from this browser?")) {
    const c = loadCfg(); delete c.token; saveCfg(c);
    document.getElementById("cfgToken").value = "";
    updateStatus();
  }
});
document.getElementById("cfgSave").addEventListener("click", async () => {
  const cfg = {
    owner: document.getElementById("cfgOwner").value.trim(),
    repo: document.getElementById("cfgRepo").value.trim(),
    branch: document.getElementById("cfgBranch").value.trim() || "main",
    path: document.getElementById("cfgPath").value.trim() || "schedule.json",
    token: document.getElementById("cfgToken").value.trim(),
  };
  saveCfg(cfg);
  closeSettings();
  await refreshSha();
  updateStatus();
});

init();
</script>
</body>
